name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not include links to copyrighted content or personal data.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a creator page
        2. Load posts and select ...
        3. Press Download
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown on the About page of the dashboard.
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Edge
        - Firefox
        - Brave
        - Other Chromium browser
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: Browser version and operating system
      placeholder: Chrome 157 on Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Dashboard > Logs > Copy. Paste the lines around the problem.
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Crop out anything private.
